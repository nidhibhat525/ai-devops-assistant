
services:
  backend:
    image: ai-devops-backend:1.0
    restart: unless-stopped
    environment:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      CHROMA_PATH: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db

  frontend:
    image: ai-devops-frontend:1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  chroma_data:
