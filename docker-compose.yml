
services:
  backend:
    image: ai-devops-backend:1.0
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_EMBED_URL: http://ollama:11434/api/embed
      OLLAMA_MODEL: llama3.2
      EMBED_MODEL: nomic-embed-text
      CHROMA_PATH: /app/chroma_db
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      - ollama

  frontend:
    image: ai-devops-frontend:1.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?$2b$12$YHOoq.CHN5R749uDpaDiRu.5IoffhC1SN5Ha3VP1ZlbHSK9q2bHnq}
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
